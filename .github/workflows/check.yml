# A pull request's entries: digests, archives, manifests (genindex -check), the protocol checker on
# the Linux build, and the build's attestation against the pinned commit and the extension's own
# release workflow.
name: check
on: pull_request
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Entries
        run: go vet ./... && go test ./... && go run ./tools/genindex -check
      - name: Changed entries' archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # rhun 0.18.2: local audio permissions and continuously animated pictures.
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhun-editor/extension-protocol/conformance/ext@b5c19dc7ebd997cef28b99a87aefde6d990abbdf
          for f in $(git diff --name-only --diff-filter=AM "origin/${GITHUB_BASE_REF}...HEAD" -- '*/*.ini' | grep -v '^pending/'); do
            full=${f%.ini}; name=${full#*/}
            tag=$(sed -n 's/^tag = //p' "$f"); commit=$(sed -n 's/^commit = //p' "$f")
            dir=$(mktemp -d)
            gh release download "$tag" -R "$full" -p "$name-linux-x86_64.tar.gz" -D "$dir"
            # built from the pinned commit by the extension's own release workflow (as the templates
            # have it), whose source the review reads at that commit
            gh attestation verify "$dir/$name-linux-x86_64.tar.gz" -R "$full" \
              --source-digest "$commit" --signer-workflow "$full/.github/workflows/release.yml"
            # the checker wants the folder rhun installs: OWNER/NAME
            mkdir -p "$dir/x/$full" && tar -xzf "$dir/$name-linux-x86_64.tar.gz" -C "$dir/x/$full"
            "$RUNNER_TEMP/bin/ext" "$dir/x/$full"
          done
